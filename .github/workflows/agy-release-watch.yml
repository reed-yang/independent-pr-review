name: Official agy release watch
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: agy-release-watch
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  watch:
    # Scheduled runs use the default branch; manual runs must select it.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the pin with official manifests
        id: check
        run: |
          python3 scripts/agy_release.py check | tee "$RUNNER_TEMP/agy-check.json"
          python3 - "$RUNNER_TEMP/agy-check.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print('status=' + report['status'])
          print('version=' + report['latest'])
          PY
      - name: Download, verify and qualify the official release
        if: steps.check.outputs.status == 'update_available'
        env:
          AGY_VERSION: ${{ steps.check.outputs.version }}
        run: python3 scripts/agy_release.py update --version "$AGY_VERSION" | tee "$RUNNER_TEMP/agy-update.json"
      - name: Provider-free checks with the new pin
        if: steps.check.outputs.status == 'update_available'
        run: |
          python3 -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/agy-tests.log"
          python3 -m independent_review.cli validate-config --config examples/review.json --out "$RUNNER_TEMP/review-check"
          python3 scripts/pin_release.py --check
      - name: Create or update the release PR
        if: steps.check.outputs.status == 'update_available'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AGY_VERSION: ${{ steps.check.outputs.version }}
          BASE_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          branch="chore/agy-$AGY_VERSION"
          # --head ignores the owner; a fork PR can reuse this branch name.
          own='[.[] | select(.isCrossRepository | not)][0].number // empty'
          number=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number,isCrossRepository --jq "$own")
          closed=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state closed --json number,isCrossRepository --jq "$own")
          if [ -z "$number" ] && [ -n "$closed" ]; then
            echo "::notice::PR #$closed for $branch was closed; reopen it manually to resume this version."
            exit 0
          fi
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          auth=(-c "http.$GITHUB_SERVER_URL/.extraheader=AUTHORIZATION: basic $basic")
          if git "${auth[@]}" ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            note="Branch $branch already existed; this run left its commits unchanged and verified the same pin generated from $BASE_BRANCH@$GITHUB_SHA."
          else
            git switch -c "$branch"
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore(agy): pin official agy $AGY_VERSION" -- independent_review/agy-release.json
            git "${auth[@]}" push origin "$branch"
            note="This run created $branch from $BASE_BRANCH@$GITHUB_SHA."
          fi
          NOTE="$note" python3 - > "$RUNNER_TEMP/agy-pr.md" <<'PY'
          import json, os, re
          temp = os.environ['RUNNER_TEMP']
          update = json.load(open(temp + '/agy-update.json'))
          log = open(temp + '/agy-tests.log').read()
          ran = re.findall(r'^Ran \d+ tests? in [0-9.]+s$', log, re.M)[-1]
          outcome = re.findall(r'^OK.*$', log, re.M)[-1]
          lines = [f"Official agy {update['latest']} from Google's update manifests replaces pinned {update['pinned']}.", '',
                   '| Platform | Manifest version | Archive SHA-512 (verified) | Bytes |', '| --- | --- | --- | --- |']
          for platform, asset in update['platforms'].items():
              lines.append(f"| {platform} | {asset['version']} | `{asset['sha512']}` | {asset['archive_bytes']} |")
          lines += ['', f"Static MaxTokensPerUserInputStep check (linux_amd64): {update['native_step_cap_matches']} match(es) "
                    'of the qualified 64000-token store; `native_input` is unchanged apart from its basis.',
                    f'Provider-free tests: {ran}, {outcome}. `validate-config` and `pin_release.py --check` passed.', '',
                    'PRs created with GITHUB_TOKEN do not trigger other workflows, so this evidence comes from the watch job: '
                    + os.environ['RUN_URL'] + '. ' + os.environ['NOTE'], '',
                    'Before merging, review the agy changelog since the pinned version for headless, stream-json, '
                    'exit-code and authentication changes. After merging, cut an engine release and update consumer pins.']
          print('\n'.join(lines))
          PY
          if [ -n "$number" ]; then
            tip=$(git "${auth[@]}" ls-remote --exit-code origin "refs/heads/$branch" | cut -f1)
            head=$(gh pr view "$number" --json headRefOid --jq .headRefOid)
            if [ "$head" != "$tip" ]; then
              echo "::error::PR #$number head $head is not the $branch tip $tip; its body was left unchanged."
              exit 1
            fi
            gh pr edit "$number" --body-file "$RUNNER_TEMP/agy-pr.md"
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "chore(agy): pin official agy $AGY_VERSION" \
              --body-file "$RUNNER_TEMP/agy-pr.md"
          fi
