name: Harness checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    # ubuntu-latest moves to 26.04 from 2026-10-19; check both until it settles.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m independent_review.cli validate-config --config examples/review.json --out /tmp/review-check
      - name: Check immutable engine references
        run: python3 scripts/pin_release.py --check
